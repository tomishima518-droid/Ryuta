<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANGUARD RUSH - PREMIUM STORE</title>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --gold: #dfb76c;
            --bg-black: #0a0a0c;
            --panel-bg: #141419;
        }
        body {
            background-color: var(--bg-black);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .shop-container {
            width: 100%;
            max-width: 400px;
            background: var(--panel-bg);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            border: 1px solid rgba(223, 183, 108, 0.15);
            text-align: center;
        }
        .tag {
            background: linear-gradient(90deg, #3a2f1b, #141419);
            color: var(--gold);
            font-size: 11px;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 16px;
            border: 1px solid rgba(223, 183, 108, 0.3);
            letter-spacing: 1px;
        }
        /* 📸 ここにカードの完成見本画像が入ります */
        .card-image-box {
            width: 100%;
            height: 240px;
            border-radius: 16px;
            background: #202026;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
        }
        .card-image-box::before {
            content: "【ここにカード画像が入る】\n比率 85.6mm × 54.1mm";
            position: absolute;
            width: 100%;
            top: 45%;
            left: 0;
            color: #555;
            font-size: 12px;
            white-space: pre;
        }
        h1 {
            font-size: 22px;
            margin: 0 0 8px 0;
            font-weight: 800;
        }
        .price-row {
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 6px;
            margin-bottom: 16px;
        }
        .price {
            font-size: 32px;
            font-weight: 900;
            color: #fff;
            font-family: 'Impact', sans-serif;
        }
        .currency { font-size: 18px; font-weight: bold; }
        .shipping-fee { color: var(--neon-cyan); font-size: 12px; font-weight: bold; }
        
        .specs {
            background: rgba(255,255,255,0.02);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 24px;
            text-align: left;
            font-size: 13px;
            color: #aaa;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .spec-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .spec-item:last-child { margin-bottom: 0; }
        .spec-item strong { color: #fff; }

        /* 🔥 迷わせないワンプッシュボタン */
        .buy-btn {
            background: linear-gradient(135deg, #ffdd93 0%, #c5a059 50%, #947130 100%);
            color: #000;
            font-size: 16px;
            font-weight: bold;
            padding: 16px;
            width: 100%;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(197, 160, 89, 0.3);
            transition: all 0.2s ease;
        }
        .buy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(197, 160, 89, 0.5);
        }
    </style>
</head>
<body>

<div class="shop-container">
    <div class="tag">⚠️ LIMITED EDITION / 限定メタル仕様</div>
    
    <div class="card-image-box"></div>
    
    <h1>VANGUARD RUSH リアルメタルカード</h1>
    
    <div class="price-row">
        <span class="currency">¥</span>
        <span class="price">2,500</span>
        <span class="shipping-fee">【送料無料 / ポスト直行】</span>
    </div>
    
    <div class="specs">
        <div class="spec-item"><span>素材</span><strong>本物ステンレス（ゴールドメッキ加工）</strong></div>
        <div class="spec-item"><span>加工</span><strong>レーザー削り出し（凹凸エッチング）</strong></div>
        <div class="spec-item"><span>厚さ・重量</span><strong>0.4mm / ずっしりヘビー仕様</strong></div>
    </div>

    <button class="buy-btn" id="checkout-button" onclick="payNow()">
        今すぐ購入する（1分で完了）
    </button>
</div>

<script>
    // 1. 本番の時はあなたのStripe公開鍵をここに入れます
    const stripe = Stripe('pk_test_51Oxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx');

    async function payNow() {
        const btn = document.getElementById('checkout-button');
        btn.innerText = "セキュリティー決済へ接続中...";
        btn.disabled = true;

        // 💳 ここからStripeの決済画面へ
        try {
            // 本来はここでRenderなどで作った「24時間動くバックエンドサーバー」を呼び出します
            const response = await fetch("https://あなたのサーバー.render.com/create-checkout-session", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ item: "metal_card_gold", qty: 1 })
            });
            const session = await response.json();
            
            // Stripeの決済画面にジャンプ！
            await stripe.redirectToCheckout({ sessionId: session.id });
            
        } catch (error) {
            // まだバックエンドサーバーを設置していない状態の時のテスト用挙動です
            alert("【ショップ画面の確認完了！】\n\nおめでとうございます！HTMLとボタンの連携は完璧です。\n\n実際にプレイヤーが本物のお金で決済できるようにするには、次のステップで『Stripeの本番用アカウント登録』と『Renderでのバックエンドサーバー設置』を行います！");
            btn.innerText = "今すぐ購入する（1分で完了）";
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
